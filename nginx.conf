# ChattyPlay-Agent 生产环境 Nginx 配置（Docker 镜像内使用）
#
# 说明：本仓库自带的前端是纯静态站点，/api 与 /ws 需要转发到外部 Hono 服务。
# 默认指向项目 .env.production / public/.htaccess 中使用的后端地址。
# 如需改为你自己的后端，直接修改下面的 upstream 即可。

upstream chattyplay_api {
    server 123.60.91.107:3001;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;

    # 带 hash 的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|mp4|webm|obj|glb|gltf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # API 反向代理
    location /api/ {
        proxy_pass         http://chattyplay_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket（闲鱼助手等）
    location /ws {
        proxy_pass         http://chattyplay_api/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    location = /health {
        proxy_pass       http://chattyplay_api/health;
        proxy_set_header Host $host;
    }

    # SPA history 路由回退
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}