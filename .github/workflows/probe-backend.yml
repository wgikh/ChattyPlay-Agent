name: Probe Backend

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vercel backend
        run: |
          echo "=== /api/health ==="
          curl -sS -i --max-time 30 "https://chattyplay-agent.vercel.app/api/health" || echo "HEALTH_FAILED"
          echo ""
          echo "=== /api/bcomic/ListRank ==="
          curl -sS --max-time 30 "https://chattyplay-agent.vercel.app/api/bcomic/ListRank" | head -c 500 || echo "LISTRANK_FAILED"
          echo ""
          echo "=== /api/bcomic/ComicDetail?comicId=1 ==="
          curl -sS -o /dev/null -w "detail_status=%{http_code}\n" --max-time 30 "https://chattyplay-agent.vercel.app/api/bcomic/ComicDetail?comicId=1" || echo "DETAIL_FAILED"
          echo ""
          echo "=== /api/translate/ (baidu proxy) ==="
          curl -sS -o /dev/null -w "translate_status=%{http_code}\n" --max-time 30 "https://chattyplay-agent.vercel.app/api/translate/vip/translate" || echo "TRANSLATE_FAILED"
