name: Probe Guest API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/auth/guest
        run: |
          echo '--- health ---'
          curl -sS -m 30 -o health.txt -w 'health_http=%{http_code}\n' https://chattyplay-agent.vercel.app/api/health || true
          cat health.txt || true
          echo
          echo '--- guest ---'
          code=$(curl -sS -m 30 -o guest.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' https://chattyplay-agent.vercel.app/api/auth/guest || echo '000')
          echo "guest_http=$code"
          cat guest.txt || true
          echo
          echo '--- pages index ---'
          curl -sS -m 30 -o index.html https://wgikh.github.io/ChattyPlay-Agent/index.html || true
          grep -oE 'assets/[A-Za-z0-9_.-]+\.js' index.html | sort -u > chunks.txt || true
          echo 'chunk_count='$(wc -l < chunks.txt)
          echo 'asset_count='$(grep -c 'assets/' index.html || true)
          echo 'index_has_chattyplay='$(grep -c -i 'chattyplay' index.html || true)
          echo 'main_script='$(grep -oE 'src="[^"]+\.js"' index.html | head -n 1)
      - name: Grep bundles for guest route
        run: |
          hit=0
          while read -r f; do
            curl -sS -m 30 "https://wgikh.github.io/ChattyPlay-Agent/$f" -o chunk.js || continue
            if grep -q 'api/auth/guest' chunk.js; then
              echo "FOUND_GUEST_ROUTE_IN $f"
              hit=1
            fi
          done < chunks.txt
          if [ "$hit" = "0" ]; then echo "NO_GUEST_ROUTE_IN_LISTED_CHUNKS"; fi